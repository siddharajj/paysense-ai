name: Sync Open Market Data (Optional Free Adzuna Refresh)

on:
  schedule:
    # Weekly Sunday 03:00 UTC ($0 on public GitHub repositories)
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run zero-dependency open data sync script
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python3 scripts/sync_open_data.py

      - name: Commit updated roles.json if changed
        run: |
          if [ -n "$(git status --porcelain data/roles.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/roles.json
            git commit -m "chore(data): weekly open market data refresh"
            git push
          else
            echo "No changes to data/roles.json"
          fi
